# Builds every program under cmd/ as a static linux binary (amd64, arm64) when a v* tag is pushed, records a build
# provenance attestation for each file, and publishes them as a GitHub release. Adding a program means adding a
# directory under cmd/; nothing here changes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The newest patch release of the language version in go.mod: the standard library is part of what govulncheck checks.
          go-version: "1.26"
          check-latest: true
      - name: go test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version, commit and build date that `--version` prints (internal/version).
          pkg=github.com/KazuhaHub/infra-hub/internal/version
          ldflags="-s -w -X ${pkg}.Version=${TAG#v} -X ${pkg}.Commit=$(git rev-parse --short=7 HEAD) -X ${pkg}.Date=$(date -u +%Y-%m-%d)"
          mkdir dist
          for dir in cmd/*/; do
            cmd=$(basename "$dir")
            go build -trimpath -ldflags "$ldflags" -o "dist/${cmd}-linux-${GOARCH}" "./cmd/${cmd}"
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum $(ls | grep -v '^SHA256SUMS$' | sort) > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  publish:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --repo "$REPOSITORY" --title "$TAG" --generate-notes --verify-tag
